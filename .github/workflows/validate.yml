name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      TZ: "UTC"
      LC_ALL: "C.UTF-8"
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Compile Python
        run: python3 -m compileall -q hooks scripts tests skills/wayfinder/scripts

      - name: Validate repository contracts
        run: python3 scripts/validate_repo.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Scan worktree and Git history for secrets
        run: python3 scripts/scan_secrets.py --all
