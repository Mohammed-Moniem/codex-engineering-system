name: Bug report
description: Report incorrect or unsafe workflow behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source, personal data, or transcripts.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - ChatGPT desktop
        - Codex CLI
        - Codex IDE
        - Plugin packaging
        - Hook
        - Validation or eval
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill or component
      placeholder: wayfinder
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a public or synthetic example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not contain a vulnerability requiring private disclosure.
          required: true
